# MOTFM Training Config — FOMO-60K Unconditional 3D (192^3)
#
# Uses the FULL MOTFM paper architecture (132.5M params) for a fair comparison.
# Architecture matches the pretrained checkpoint exactly: num_channels=[32,64,160,480],
# transformer_num_layers=6. Fits within A100 40GB (~12 GB training, ~6 GB inference).
#
# Step-matched to the paper: 750 scans × 200 epochs × accum=1 = 150,000 optimizer
# steps. With 5,471 scans and 3 GPUs (accum=1, no gradient accumulation — matches
# paper), each epoch = ceil(5471/3) = 1,824 steps → 83 epochs × 1,824 = 151,392
# steps ≈ 150K.
#
# Train: python -u experiments/MOTFM/train_motfm.py --config_path <this_file>

model_args:
  spatial_dims: 3
  in_channels: 1
  out_channels: 1
  num_res_blocks: [2, 2, 2, 2]
  num_channels: [32, 64, 160, 480]           # match MOTFM paper architecture (132.5M params)
  attention_levels: [False, False, False, True]
  norm_num_groups: 32
  resblock_updown: True
  num_head_channels: [32, 64, 160, 480]      # match MOTFM paper architecture
  transformer_num_layers: 6                   # match MOTFM paper architecture
  use_flash_attention: true
  with_conditioning: False
  mask_conditioning: False

data_args:
  pickle_path: "/mnt/home/users/tic_163_uma/mpascual/fscratch/datasets/FOMO60K/FOMO60K_MOTFM/fomo60k_3d.pkl"
  h5_path: "/mnt/home/users/tic_163_uma/mpascual/fscratch/datasets/FOMO60K/FOMO60K_MOTFM/fomo60k_3d.h5"
  split_train: "train"
  split_val: "valid"
  volume_size: 192                     # FOMO-60K volumes are 192^3
  image_norm: "minmax_0_1"
  norm_scope: "global"

train_args:
  num_epochs: 83                    # step-matched to 150K for 3 GPUs; update if changing N_GPUS
  batch_size: 1
  lr: 0.0001
  gradient_accumulation_steps: 1       # Paper used no accumulation (accum=1)
  grad_clip_norm: 1.0
  device: "cuda"
  checkpoint_dir: "/mnt/home/users/tic_163_uma/mpascual/execs/neuromf/results/motfm/checkpoints"
  val_freq: 10
  num_val_samples: 4
  seed: 42
  precision: "bf16-mixed"
  accelerator: "gpu"
  devices: "auto"
  deterministic: False
  log_every_n_steps: 50
  num_sanity_val_steps: 0
  num_workers: 8                    # per-GPU; HDF5 lazy loading is I/O-bound

solver_args:
  method: "euler"
  step_size: 0.1
  time_points: 10

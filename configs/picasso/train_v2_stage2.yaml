# Picasso A100 overrides for NeuroMF v2 Stage 2 (α-Flow MF fine-tuning)
# Merged on top of: picasso/base.yaml -> train_meanflow.yaml -> train_v2_stage2.yaml -> this file
#
# Hardware: 3x A100-SXM4-40GB, 7-day SLURM wall limit
# Boundary condition adds ~30-40% epoch time vs v-head approach.
#
# Effective batch = 2 × 3 × 22 = 132
# Steps/epoch ≈ 5471 / 132 ≈ 42
# Epoch time ≈ 22 min → ~458 epochs max in 7 days
#
# Early stopping strategy (3 layers of defence):
#   1. FID-based early stopping: patience=15 → stops after 150 epochs of no FID improvement
#   2. Wall-time guard (Timer): stops training 4h before 7-day SLURM wall → time for on_fit_end
#   3. max_epochs=700: hard cap (unreachable given timer, but safe default)
#
# α schedule: ramps over 300 epochs (12600 steps), then 100+ epochs of stable α=1

# --- Picasso paths ---
paths:
  checkpoints_dir: "${paths.results_root}/v2_stage2/checkpoints"
  logs_dir: "${paths.results_root}/v2_stage2/logs"
  samples_dir: "${paths.results_root}/v2_stage2/samples"
  diagnostics_dir: "${paths.results_root}/v2_stage2/diagnostics"
  maisi_vae_weights: "${paths.checkpoints_root}/NV-Generate-MR/models/autoencoder_v2.pt"

# --- Multi-GPU DDP: 3 A100s ---
trainer:
  devices: 3
  strategy: ddp
  accelerator: gpu

# --- Training hardware overrides ---
training:
  batch_size: 2
  num_workers: 16
  prefetch_factor: 4
  accumulate_grad_batches: 22        # eff batch = 2 × 3 × 22 = 132
  log_every_n_steps: 10
  wall_time: "6-20:00:00"           # Stop 4h before 7-day SLURM wall for on_fit_end hooks
  augmentation:
    enabled: true

# --- Diagnostics on for Picasso ---
diagnostics:
  enabled: true

# --- Evaluation: FID-based early stopping (tighter for 7-day wall) ---
# Stage 2 targets 1-NFE generation — evaluate at NFE=1.
evaluation:
  enabled: true
  fid_mode: "3d"
  fid_every_n_val_epochs: 1
  fid_weights_path: "${paths.checkpoints_root}/fid_weights/radimagenet_resnet50.pt"
  fid_3d_weights_path: "${paths.checkpoints_root}/r3d_18_fid3d/r3d_18-b3b3357e.pth"
  early_stop_patience: 12           # 12 FID evals × 10 epochs = 120 training epochs without improvement
  eval_nfe: 1                       # 1-NFE eval: this is what Stage 2 optimises for

# --- VAE: A100 settings ---
vae:
  norm_float16: true
  num_splits: 1

# DDPM Baseline Config — FOMO-60K Unconditional 3D (192^3)
#
# Same UNet architecture as MOTFM (132.5M params) for a fair comparison.
# Only the loss function (noise prediction MSE) and sampler (DDIM) differ.
#
# Step-matched to MOTFM: 83 epochs with 3 GPUs ≈ 150K optimizer steps.
#
# Train: python experiments/DDPM/train_ddpm.py --config_path <this_file>

model_args:
  spatial_dims: 3
  in_channels: 1
  out_channels: 1
  num_res_blocks: [2, 2, 2, 2]
  num_channels: [32, 64, 160, 480]           # match MOTFM paper architecture (132.5M params)
  attention_levels: [False, False, False, True]
  norm_num_groups: 32
  resblock_updown: True
  num_head_channels: [32, 64, 160, 480]
  transformer_num_layers: 6
  use_flash_attention: true
  with_conditioning: False
  mask_conditioning: False

data_args:
  pickle_path: "/mnt/home/users/tic_163_uma/mpascual/fscratch/datasets/FOMO60K/FOMO60K_MOTFM/fomo60k_3d.pkl"
  h5_path: "/mnt/home/users/tic_163_uma/mpascual/fscratch/datasets/FOMO60K/FOMO60K_MOTFM/fomo60k_3d.h5"
  split_train: "train"
  split_val: "valid"
  volume_size: 192
  image_norm: "minmax_0_1"
  norm_scope: "global"

diffusion_args:
  num_train_timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  beta_schedule: "linear_beta"
  prediction_type: "epsilon"

train_args:
  num_epochs: 83                    # step-matched to 150K for 3 GPUs
  batch_size: 1
  lr: 0.0001
  gradient_accumulation_steps: 1
  grad_clip_norm: 1.0
  device: "cuda"
  checkpoint_dir: "/mnt/home/users/tic_163_uma/mpascual/execs/neuromf/results/ddpm/checkpoints"
  pretrained_checkpoint_path: null
  val_freq: 10
  early_stop_patience: 5
  num_val_samples: 4
  seed: 42
  precision: "bf16-mixed"
  accelerator: "gpu"
  devices: "auto"
  deterministic: False
  log_every_n_steps: 50
  num_sanity_val_steps: 0
  num_workers: 8

# Phase 5: Generation & Evaluation Configuration
# Used by generate_latents.py, decode_volumes.py, compute_metrics.py

generation:
  n_samples: 500
  nfe_levels: [1, 10, 50]
  decode_nfe_levels: [1, 10, 50]
  batch_size_generate: 8
  batch_size_decode: 1
  base_seed: 42
  prediction_type: "x"
  latent_shape: [4, 48, 48, 48]
  volume_shape: [1, 192, 192, 192]

  # Post-hoc sampling enhancements for 1-NFE quality improvement
  enhancements:
    norm_correction: 1.00        # Gamma dividing velocity (1.0 = no correction)
    stochastic_perturbation:
      enabled: false
      sigma_inject: null        # Per-channel [s0, s1, s2, s3] or null (auto-calibrate)
      auto_calibrate: true      # If sigma_inject is null, compute from NFE=1 vs NFE=50
      calibration_n_samples: 50 # Samples used for auto-calibration
    variance_rescale:
      enabled: false            # Match generated stats to training data stats
    comparison_mode: false      # Generate both baseline + enhanced with same noise


features:
  med3d:
    enabled: true
    # R3D-18 (Kinetics-400) replaces Med3D ResNet-50 (feature collapse).
    # torchvision auto-downloads weights; explicit path for offline nodes.
    weights_path: ""
    batch_size: 1
  radimagenet:
    enabled: true
    weights_path: ""
    center_slices_ratio: 0.6
    batch_size: 16

metrics:
  fid_3d: true
  fid_2d5: true
  mmd: true
  ms_ssim: true
  psnr: true
  coverage_density: true
  spectral: true
  synthseg: true
  pairing:
    method: "nearest_neighbour"
    feature_space: "med3d"
    k: 5

synthseg:
  # Command to invoke SynthSeg. Two supported modes:
  #   FreeSurfer:  ["mri_synthseg"]
  #   Standalone:  ["/path/to/synthseg_env/bin/python", "/path/to/SynthSeg/scripts/commands/SynthSeg_predict.py"]
  command: ["mri_synthseg"]
  robust: true
  parc: false
  threads: 0
  crop: 0
  voxel_size_mm: 1.0
  regions_of_interest:
    - "Left-Hippocampus"
    - "Right-Hippocampus"
    - "Left-Lateral-Ventricle"
    - "Right-Lateral-Ventricle"
    - "Left-Cerebral-Cortex"
    - "Right-Cerebral-Cortex"
    - "Left-Thalamus"
    - "Left-Caudate"
    - "Left-Putamen"
    - "Left-Cerebellum-Cortex"

# MRI preprocessing (for prepare_real_test.py — must match Phase 1 encoding)
data:
  target_shape: [192, 192, 192]
  target_spacing: [1.0, 1.0, 1.0]
  intensity_lower_percentile: 0.0
  intensity_upper_percentile: 99.5
  intensity_b_min: 0.0
  intensity_b_max: 1.0

timing:
  n_warmup: 10
  n_measured: 90
  batch_size: 1

# Paths (resolved against base.yaml)
paths:
  checkpoint: ""
  latent_stats: ${paths.results_root}/latents/latent_stats.json
  generation_dir: ${paths.results_root}/generation
  features_dir: ${paths.results_root}/features
  metrics_dir: ${paths.results_root}/metrics

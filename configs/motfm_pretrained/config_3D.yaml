# MOTFM Pretrained Config — Author-provided 3D Unconditional MRI
#
# Copied from the pretrained checkpoint directory for version control.
# Architecture: 132.5M params (larger than our FOMO-60K config).
# Trained on a tumor MRI dataset with [-1, 1] normalization.
#
# Use ONLY for inference with the author-provided checkpoint:
#   epoch119-valloss0.040524.ckpt
#
# DO NOT use for training on FOMO-60K (architecture mismatch with our config).

model_args:
  spatial_dims: 3
  in_channels: 1
  out_channels: 1
  num_res_blocks: [2, 2, 2, 2]
  num_channels: [32, 64, 160, 480]
  attention_levels: [False, False, False, True]
  norm_num_groups: 32
  resblock_updown: True
  num_head_channels: [32, 64, 160, 480]
  transformer_num_layers: 6
  use_flash_attention: true
  with_conditioning: false
  mask_conditioning: false

data_args:
  pickle_path: "unused_for_inference"
  split_train: "train"
  split_val: "train"
  volume_size: 96                    # MSD Brain volumes are 96^3 (from MOTFM GitHub)
  image_norm:
    mode: "auto"
    scope: "sample"
    range: [-1.0, 1.0]

train_args:
  num_epochs: 130
  batch_size: 1
  gradient_accumulation_steps: 4
  lr: 0.0001
  val_freq: 5
  num_val_samples: 4
  seed: 42
  accelerator: "gpu"
  devices: 1
  num_workers: 4
  log_every_n_steps: 10
  checkpoint_dir: "unused_for_inference"

solver_args:
  method: "euler"
  step_size: 0.1
  time_points: 10
